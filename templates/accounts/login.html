{% extends "_login_base.html" %}
{% load static %}

{% block content %}
<section class="bg-gray-50 dark:bg-gray-900">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
      <a href="#" class="flex items-center mb-2 text-2xl font-semibold text-gray-900 dark:text-white">
          <img class="w-16 h-16 ml-2" src="{% static 'img/logo/logo.webp'%}" alt="logo">              
      </a>
      <h2 class="mb-6 text-2xl font-semibold text-gray-900 dark:text-white">جهاددانشگاهی واحد البرز</h2>
      <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl text-center font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                  ورود به سامانه اموال
              </h1>
              <form class="space-y-4 md:space-y-6" action="#">
                {% csrf_token %}

                
                  <div>
                      <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{ form.username.label }}</label>
                      {{ form.username }}
                  </div>
                  <div>
                      <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{ form.password.label }}</label>
                      {{ form.password }}
                  </div>
                  <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">ورود</button>
                  <p class="text-sm font-light text-gray-500 dark:text-gray-400">
                      در صورت فراموشی رمز عبور با کارشناس سامانه تماس بگیرید.
                  </p>
              </form>
          </div>
      </div>
  </div>
</section>
{% endblock content %}
